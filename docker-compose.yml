services:
  mongodb:
    image: mongo:7
    container_name: mongodb_container
    ports:
      # Bound to loopback so the database is reachable from this machine only.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: python_app_container
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ${SOURCE_DIR:-./data}:/data:ro
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    # Override with APP_ARGS in .env, e.g. "summary" or "upload /data --dry-run".
    command: ${APP_ARGS:-upload /data}

volumes:
  mongodb_data:
